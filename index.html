<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalkulator PNG MRSM (Upperform)</title>
<style>
    body { background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url("bg.JPG"); background-size: cover; text-align: center; font-family: Arial, sans-serif; color: white;}
    input[type="number"], input[type="text"] { width: 120px; text-align: center; margin-bottom:5px; }
    button { padding: 8px 16px; font-size:16px; cursor:pointer; margin-top:10px; }
</style>
</head>
<body>
<h1>Kalkulator PNG MRSM</h1>

<div>
    <label>Nama</label>
    <input type="text" id="nama">
</div>
<div>
    <label>BM</label>
    <input type="number" id="melayu" min="0" max="100">
</div>
<div>
    <label>BI</label>
    <input type="number" id="inggeris" min="0" max="100">
</div>
<div>
    <label>Math</label>
    <input type="number" id="math" min="0" max="100">
</div>
<div>
    <label>Add Math</label>
    <input type="number" id="addmath" min="0" max="100">
</div>
<div>
    <label>Fizik</label>
    <input type="number" id="phy" min="0" max="100">
</div>
<div>
    <label>Kimia</label>
    <input type="number" id="chem" min="0" max="100">
</div>
<div>
    <label>Bio / Prinsip</label>
    <input type="number" id="bio" min="0" max="100">
</div>
<div>
    <label>Sejarah</label>
    <input type="number" id="sej" min="0" max="100">
</div>
<div>
    <label>Pendidikan Islam</label>
    <input type="number" id="islam" min="0" max="100">
</div>
<div>
    <label>Pendidikan Jasmani</label>
    <input type="number" id="pj" min="0" max="100">
</div>

<button onclick="calculateAndSend()">Kira & Submit</button>
<p id="result"></p>

<script>
function calculateGrade(score,type){
    if(type==="BM"){if(score>=85)return 4;if(score>=80)return 3.67;if(score>=75)return 3.33;if(score>=70)return 3;if(score>=65)return 2.67;if(score>=60)return 2.33;if(score>=55)return 2;if(score>=50)return 1.67;if(score>=45)return 1.33;if(score>=40)return 1;return 0;}
    else if(type==="BI"){if(score>=80)return 4;if(score>=75)return 3.67;if(score>=70)return 3.33;if(score>=65)return 3;if(score>=60)return 2.67;if(score>=55)return 2.33;if(score>=50)return 2;if(score>=45)return 1.67;if(score>=40)return 1.33;if(score>=35)return 1;return 0;}
    else if(type==="AddMath"){if(score>=75)return 4;if(score>=65)return 3.67;if(score>=60)return 3.33;if(score>=55)return 3;if(score>=50)return 2.67;if(score>=45)return 2.33;if(score>=40)return 2;if(score>=35)return 1.67;if(score>=30)return 1.33;if(score>=25)return 1;return 0;}
    else{if(score>=75)return 4;if(score>=70)return 3.67;if(score>=65)return 3.33;if(score>=60)return 3;if(score>=55)return 2.67;if(score>=50)return 2.33;if(score>=45)return 2;if(score>=40)return 1.67;if(score>=35)return 1.33;if(score>=30)return 1;return 0;}
}

function calculateAndSend(){
    let nama = document.getElementById("nama").value.trim();
    if(!nama){ alert("Sila masukkan nama!"); return;}

    let melayu = parseFloat(document.getElementById("melayu").value) || 0;
    let inggeris = parseFloat(document.getElementById("inggeris").value) || 0;
    let math = parseFloat(document.getElementById("math").value) || 0;
    let addmath = parseFloat(document.getElementById("addmath").value) || 0;
    let phy = parseFloat(document.getElementById("phy").value) || 0;
    let chem = parseFloat(document.getElementById("chem").value) || 0;
    let bio = parseFloat(document.getElementById("bio").value) || 0;
    let sej = parseFloat(document.getElementById("sej").value) || 0;
    let islam = parseFloat(document.getElementById("islam").value) || 0;
    let pj = parseFloat(document.getElementById("pj").value) || 0;

    let total = calculateGrade(melayu,"BM")*6 + calculateGrade(inggeris,"BI")*6 + calculateGrade(math,"BI")*6 + calculateGrade(addmath,"AddMath")*6 + calculateGrade(phy,"Phy")*6 + calculateGrade(chem,"Phy")*6 + calculateGrade(bio,"Phy")*6 + calculateGrade(sej,"Sej")*4 + calculateGrade(islam,"Sej")*5 + calculateGrade(pj,"Sej")*2;
    let purata = total/53;

    document.getElementById("result").innerText = "PNG anda: "+purata.toFixed(3);

    // submit pakai fetch
    let formData = new FormData();
    formData.append("entry.246583447", nama);
    formData.append("entry.1081059050", melayu);
    formData.append("entry.657450509", inggeris);
    formData.append("entry.1124486425", math);
    formData.append("entry.771728114", addmath);
    formData.append("entry.700157771", phy);
    formData.append("entry.482638229", chem);
    formData.append("entry.1508340325", bio);
    formData.append("entry.1146377368", sej);
    formData.append("entry.776270194", islam);
    formData.append("entry.1121261084", pj);
    formData.append("entry.1811812483", purata.toFixed(3));

    fetch("https://docs.google.com/forms/d/e/1FAIpQLScV0Qx6YiopJzlvEoxV7wLQmPPIbXXlJioZJCDZyjjkl2Gl2g/formResponse", { method:"POST", mode:"no-cors", body: formData });
}
</script>
</body>
</html>
